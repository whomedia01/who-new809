<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Matte Metallic Dark Gradients matching WHO MEDIA wall emblem -->
    <linearGradient id="gradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333842" />
      <stop offset="50%" stop-color="#1C1F26" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <linearGradient id="gradInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4350" />
      <stop offset="50%" stop-color="#232731" />
      <stop offset="100%" stop-color="#12151B" />
    </linearGradient>
    <linearGradient id="gradOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2E38" />
      <stop offset="100%" stop-color="#111318" />
    </linearGradient>
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- 1. Far Left Slab -->
    <path d="M 12 28 L 26 17 L 35 81 L 12 72 Z" fill="url(#gradOuter)" stroke="#08090B" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 2. Left Inner Slab -->
    <path d="M 28 15.5 L 47 7 L 36 84 L 37 80.5 Z" fill="url(#gradInner)" stroke="#08090B" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 3. Center Diamond (W Core) -->
    <path d="M 50 5 L 64 50 L 50 95 L 36 50 Z" fill="url(#gradCenter)" stroke="#060709" stroke-width="1.6" stroke-linejoin="round" />
    <!-- Center Bevel line -->
    <line x1="50" y1="5" x2="50" y2="95" stroke="#4A5162" stroke-width="0.8" opacity="0.5" />

    <!-- 4. Right Inner Slab -->
    <path d="M 72 15.5 L 53 7 L 64 84 L 63 80.5 Z" fill="url(#gradInner)" stroke="#08090B" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 5. Far Right Slab -->
    <path d="M 88 28 L 74 17 L 65 81 L 88 72 Z" fill="url(#gradOuter)" stroke="#08090B" stroke-width="1.4" stroke-linejoin="round" />
  </g>
</svg>
